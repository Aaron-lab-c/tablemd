[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tablemd"
version = "0.1.0"
description = "Convert Markdown tables to CSV / TSV / JSON / Excel and back. Library + CLI, clipboard-aware, CJK-friendly."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "ARON" }]
keywords = [
  "markdown",
  "table",
  "csv",
  "tsv",
  "json",
  "excel",
  "xlsx",
  "converter",
  "cli",
  "clipboard",
  "llm",
  "chatgpt",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Topic :: Office/Business :: Financial :: Spreadsheet",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
xlsx = ["openpyxl>=3.0"]
pandas = ["pandas>=1.3"]
all = ["openpyxl>=3.0", "pandas>=1.3"]

[project.urls]
Homepage = "https://github.com/Aaron-lab-c/tablemd"
Repository = "https://github.com/Aaron-lab-c/tablemd"
Issues = "https://github.com/Aaron-lab-c/tablemd/issues"
Changelog = "https://github.com/Aaron-lab-c/tablemd/blob/main/CHANGELOG.md"

[project.scripts]
tablemd = "tablemd.cli:main"

[tool.hatch.build.targets.sdist]
include = [
  "src/tablemd",
  "tests",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tablemd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
