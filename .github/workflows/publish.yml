# Publishes to PyPI through "Trusted Publishing" (OpenID Connect) — no API
# token is stored anywhere. One-time setup on PyPI:
#   https://pypi.org/manage/account/publishing/  ->  "Add a new pending publisher"
#     PyPI project name : tablemd
#     Owner             : <your GitHub user name>
#     Repository name   : tablemd
#     Workflow name     : publish.yml
#     Environment name  : pypi
# Then release by pushing a tag that matches the version in pyproject.toml:
#   git tag v0.1.0 && git push origin v0.1.0

name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'EOF'
          import os, sys, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if tag != version:
              sys.exit(f"tag v{tag} does not match pyproject version {version}")
          print(f"releasing tablemd {version}")
          EOF
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tablemd/
    permissions:
      id-token: write   # required for Trusted Publishing
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
